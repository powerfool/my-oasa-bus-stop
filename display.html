<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OASA Display</title>
  <style>
    @font-face {
      font-family: 'VT323';
      src: url('/static/VT323.woff2') format('woff2');
      font-display: block;
    }
  </style>
  <style>
    :root {
      --amber: #f5c400;
      --amber-dim: #7a6100;
      --amber-glow: rgba(245, 196, 0, 0.25);
      --bg: #050500;
      --row-border: #1a1600;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--amber);
      font-family: 'VT323', 'Courier New', monospace;
      overflow: hidden;
    }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ── scanline overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.08) 3px,
        rgba(0, 0, 0, 0.08) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* ── header ── */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.8vh 2vw;
      border-bottom: 2px solid var(--amber-dim);
      flex-shrink: 0;
    }

    #title {
      font-size: clamp(1rem, min(4vw, 3.2vh), 2.2rem);
      text-shadow: 0 0 12px var(--amber), 0 0 24px var(--amber-glow);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #updated-at {
      font-size: clamp(0.9rem, min(3.4vw, 2.8vh), 2rem);
      color: var(--amber-dim);
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    /* ── stops ── */
    #stops {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* Each section's flex-grow is set from JS to its row count, so every
       arrival row ends up the same height whatever the number of buses. */
    .stop-section {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* stop label bar: solid amber "inverse video" strip so the stop name is
       easy to pick out; doubles as the column legend (same grid as the rows) */
    .stop-label {
      display: grid;
      grid-template-columns: 1fr 3fr 1fr;
      align-items: center;
      padding: 0.4vh 2vw;
      background: var(--amber);
      color: var(--bg);
      flex-shrink: 0;
      font-size: clamp(1rem, min(3.6vw, 3.2vh), 2.2rem);
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .stop-label .legend {
      color: rgba(5, 5, 0, 0.6);
      font-size: 0.7em;
    }
    .stop-label .legend:last-child { text-align: right; }
    .stop-label .stop-name {
      padding: 0 2vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── arrivals list ── */
    .arrivals {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Every row is a size container: all text below is sized from the row's
       own height/width (cqh/cqw), so it always fits without scrolling. */
    .arrival-row {
      container-type: size;
      display: grid;
      grid-template-columns: 1fr 3fr 1fr;
      align-items: center;
      padding: 0 2vw;
      border-bottom: 1px solid var(--row-border);
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
    }
    .arrival-row:last-child { border-bottom: none; }

    .line-num {
      font-size: min(68cqh, 10cqw);
      line-height: 1;
      text-shadow: 0 0 14px var(--amber), 0 0 30px var(--amber-glow);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .destination {
      font-size: min(46cqh, 4.2cqw);
      line-height: 1;
      text-shadow: 0 0 8px var(--amber-glow);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0 2vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .minutes {
      text-align: right;
      font-size: min(76cqh, 9cqw);
      line-height: 1;
      text-shadow: 0 0 18px var(--amber), 0 0 40px var(--amber-glow);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .minutes .unit {
      font-size: 0.4em;
      color: var(--amber-dim);
      margin-left: 0.1em;
    }

    /* arriving now */
    .arrival-row.now .minutes { color: #fff; text-shadow: 0 0 20px #fff, 0 0 40px var(--amber); }
    .arrival-row.now .line-num { color: #fff; text-shadow: 0 0 20px #fff, 0 0 40px var(--amber); }

    /* ── empty / error states ── */
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1rem, min(4.5vw, 4vh), 2.2rem);
      color: var(--amber-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── footer (only takes space when there is a message) ── */
    #footer {
      flex-shrink: 0;
      text-align: center;
      padding: 0.3vh 1vw;
      font-size: clamp(0.7rem, min(2.2vw, 2vh), 1.1rem);
      color: var(--amber-dim);
      letter-spacing: 0.08em;
      border-top: 1px solid var(--row-border);
    }
    #footer:empty { display: none; }

    #lock-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 2vw;
      padding: 0.4vh 2vw;
      border-top: 1px solid var(--row-border);
    }
    #lock-btn {
      background: none;
      border: 1px solid var(--amber-dim);
      color: var(--amber-dim);
      font-family: 'VT323', monospace;
      font-size: clamp(0.7rem, min(2.2vw, 2vh), 1.1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2vh 2vw;
      cursor: pointer;
      white-space: nowrap;
    }

    /* blink dot on stale data */
    @keyframes blink { 50% { opacity: 0; } }
    .stale { animation: blink 1s step-start infinite; }

    /* ── portrait: same 3-column rows, re-proportioned for a narrow screen ── */
    @media (orientation: portrait) {
      .stop-label { grid-template-columns: 1fr; }
      .stop-label .legend { display: none; }
      .stop-label .stop-name { padding: 0; }

      .arrival-row {
        grid-template-columns: minmax(0, 2.2fr) minmax(0, 4fr) minmax(0, 2.6fr);
        padding: 0 3vw;
      }
      .line-num    { font-size: min(62cqh, 15cqw); }
      .minutes     { font-size: min(70cqh, 14cqw); }
      .minutes .unit { font-size: 0.35em; }
      .destination {
        font-size: min(24cqh, 4.6cqw);
        line-height: 1.05;
        padding: 0 2vw;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }
    }
  </style>
</head>
<body>
  <div id="header">
    <span id="title">ΑΦΙΞΕΙΣ</span>
    <span id="updated-at">—</span>
  </div>

  <div id="stops"></div>

  <div id="footer"></div>

  <div id="lock-bar">
    <button id="lock-btn">LOCK SCREEN</button>
    <video id="lock-video" src="/static/nosleep.mp4" muted loop playsinline webkit-playsinline
           style="flex:1;height:10px;display:none;"></video>
  </div>

  <script>
    const POLL_MS = 30_000;
    let lastUpdated = null;

    async function refresh() {
      try {
        const res = await fetch('/api/arrivals');
        const data = await res.json();

        const updatedEl = document.getElementById('updated-at');
        if (data.updated_at) {
          lastUpdated = data.updated_at;
          updatedEl.textContent = data.updated_at;
          updatedEl.classList.remove('stale');
        } else {
          updatedEl.classList.add('stale');
        }

        const stopsEl = document.getElementById('stops');
        stopsEl.innerHTML = '';

        // Fall back to the legacy single-stop fields if `stops` is absent.
        const stops = data.stops && data.stops.length
          ? data.stops
          : [{ name: data.stop_name, arrivals: data.arrivals, error: data.error }];

        stops.forEach(stop => {
          const section = document.createElement('div');
          section.className = 'stop-section';

          // One grid row's worth of height per bus (or per empty-state message)
          section.style.flexGrow = Math.max((stop.arrivals || []).length, 1);

          const label = document.createElement('div');
          label.className = 'stop-label';
          const mk = (cls, text) => {
            const el = document.createElement('span');
            el.className = cls;
            el.textContent = text;
            return el;
          };
          label.appendChild(mk('legend', 'ΓΡΑΜΜΗ'));
          label.appendChild(mk('stop-name', stop.name || '—'));
          label.appendChild(mk('legend', 'ΛΕΠΤΑ'));
          section.appendChild(label);

          const container = document.createElement('div');
          container.className = 'arrivals';
          section.appendChild(container);

          if (!stop.arrivals || stop.arrivals.length === 0) {
            const msg = document.createElement('div');
            msg.className = 'empty-state';
            msg.textContent = stop.error
              ? 'ΣΦΑΛΜΑ ΣΥΝΔΕΣΗΣ'
              : 'ΔΕΝ ΥΠΑΡΧΟΥΝ ΔΡΟΜΟΛΟΓΙΑ';
            container.appendChild(msg);
          } else {
            stop.arrivals.forEach(a => {
              const row = document.createElement('div');
              row.className = 'arrival-row' + (a.minutes <= 1 ? ' now' : '');

              const lineNum = document.createElement('span');
              lineNum.className = 'line-num';
              lineNum.textContent = a.line_id;

              const dest = document.createElement('span');
              dest.className = 'destination';
              dest.textContent = a.destination;

              const mins = document.createElement('span');
              mins.className = 'minutes';
              if (a.minutes <= 1) {
                mins.innerHTML = 'ΤΩΡΑ';
              } else {
                mins.innerHTML = `${a.minutes}<span class="unit">λ</span>`;
              }

              row.appendChild(lineNum);
              row.appendChild(dest);
              row.appendChild(mins);
              container.appendChild(row);
            });
          }
          stopsEl.appendChild(section);
        });

        document.getElementById('footer').textContent =
          data.error ? `⚠ ${data.error}` : '';

      } catch (e) {
        document.getElementById('footer').textContent = `⚠ ${e.message}`;
      }
    }

    refresh();
    setInterval(refresh, POLL_MS);

    const lockBtn = document.getElementById('lock-btn');
    const lockVideo = document.getElementById('lock-video');
    lockBtn.addEventListener('click', () => {
      lockVideo.style.display = 'block';
      lockVideo.play().then(() => {
        lockBtn.textContent = 'LOCKED';
        lockBtn.style.color = '#f5c400';
        lockBtn.style.borderColor = '#f5c400';
        lockBtn.style.cursor = 'default';
        lockBtn.disabled = true;
      }).catch(() => {});
    });
  </script>
</body>
</html>
